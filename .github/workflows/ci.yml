  build-and-deploy:
    runs-on: [self-hosted, checkmate]
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build and Push Image with Jib
        env:
          OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
        run: |
          # 별도의 도커 설치 없이 Gradle만으로 빌드 및 푸시까지 완료
          # -Djib.to.tags를 통해 GitHub SHA를 태그로 추가 주입합니다.
          chmod +x ./gradlew
          ./gradlew jib \
            -Djib.to.tags=latest,${{ github.sha }} \
            --no-daemon

      - name: Checkout Manifest Repository
        run: |
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/starmix-ajou/checkmate-manifest.git manifests

      - name: Update image tag and inject webhook secret (Python)
        env:
          GITHUB_SHA: ${{ github.sha }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          python3 - <<'PY'
          import os, re

          man_dep = 'manifests/apps/backend/deployment.yaml'
          man_app = 'manifests/apps/backend/application.yaml'
          IMAGE = os.environ.get('IMAGE_NAME', '')
          SHA = os.environ.get('GITHUB_SHA', '')
          WEBHOOK = os.environ.get('WEBHOOK_SECRET', '')

          def update_file(path, pattern, replacement):
              if os.path.exists(path):
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  new_content = re.sub(pattern, replacement, content)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_content)

          # 이미지 태그 업데이트
          update_file(man_dep, rf"image:\s*{re.escape(IMAGE)}:.*", f"image: {IMAGE}:{SHA}")
          # 웹훅 시크릿 주입
          update_file(man_app, r'(\$\{?WEBHOOK_SECRET\}?)', WEBHOOK)
          PY

      - name: Commit and Push to Manifest Repo
        run: |
          cd manifests
          git config user.name "yeonnnnjs"
          git config user.email "sungyeon52@gmail.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update image tag to ${GITHUB_SHA}" && git push origin main)
