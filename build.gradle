plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.google.cloud.tools.jib' version '3.4.0'
}

group = 'com.starmix'
version = '0.0.1-SNAPSHOT'

jib {
    from {
        image = 'eclipse-temurin:21-jre-alpine'
        platforms {
            platform {
                architecture = 'arm64'
                os = 'linux'
            }
        }
    }
    to {
        image = "yny.ocir.io/ax1nm9kw34v6/checkmate" 
        tags = ['latest'] // GitHub Actions에서 추가 태그 주입 예정
        auth {
            username = System.getenv('OCI_REGISTRY_USERNAME')
            password = System.getenv('OCI_REGISTRY_PASSWORD')
        }
    }
    container {
        jvmFlags = [
            '-XX:+UseContainerSupport',
            '-XX:MaxRAMPercentage=75.0',
            '-Djava.security.egd=file:/dev/./urandom',
            '-Duser.timezone=Asia/Seoul'
        ]
        ports = ['8080']
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Spring Security - OAuth
	implementation "org.springframework.boot:spring-boot-starter-security"

	// Database
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.junit.platform:junit-platform-suite'
	testImplementation 'org.junit.platform:junit-platform-suite-api'
	testImplementation 'org.junit.platform:junit-platform-suite-engine'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

	// OpenFeign
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.2.1'

	// Mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// PortOne
	implementation 'io.portone:server-sdk:0.19.0'

	// Object Storage
	implementation platform('software.amazon.awssdk:bom:2.25.20')
	implementation 'software.amazon.awssdk:s3'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.jacocoTestReport
}

jacoco {
	toolVersion = "0.8.10"
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required.set(true)
		xml.required.set(true)
		csv.required.set(false)
		html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
	}

	classDirectories.setFrom(
			files(fileTree(
					dir: "$buildDir/classes/java/main",
					excludes: [
							"**/adapter/in/**",
							"**/infrastructure/**",
							"**/global/**",
							"**/application/**",
							"**/adapter/out/ai/**",
							"**/adapter/out/mail/**",
							"**/adapter/out/oauth/**",
							"**/adapter/out/objectStorage/**",
							"**/adapter/out/payment/**",
							"**/adapter/out/redis/**",
							"**/adapter/out/slack/**",
							"**/adapter/out/persistence/adapter/**",
							"**/adapter/out/persistence/dto/**",
							"**/adapter/out/persistence/entity/**",
							"**/adapter/out/persistence/mongo/**",
							"**/CheckmateApplication.class"
					]
			))
	)
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			element = 'BUNDLE'
			includes = ['com.starmix.checkmate.*']
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification
